[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aistrip"
version = "0.1.0"
description = "CLI tool to detect and remove AI metadata (EXIF, XMP, C2PA) from images — stop Instagram from auto-labeling your photos as AI content."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["ai", "metadata", "c2pa", "exif", "xmp", "instagram", "canva"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0.0",
    "piexif>=1.1.3",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pillow-heif>=0.18.0",
]

[project.scripts]
aistrip = "aistrip.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/aistrip"
Repository = "https://github.com/yourusername/aistrip"
"Bug Tracker" = "https://github.com/yourusername/aistrip/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aistrip"]
